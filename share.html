
<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>คลังเก็บของขลัง</title>


    <style>

        body {
            font-family: Arial, sans-serif;

            background: #f0fdf4;

            text-align: center;

            padding-top: 100px;
        }


        .box {

            background: white;

            width: 600px;

            max-width: 90%;

            margin: auto;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.1);
        }


        h1 {

            color: #166534;

            margin-bottom: 20px;
        }


        .description {

            color: #64748b;

            line-height: 1.8;

            margin-bottom: 30px;
        }


        /* =========================
           กล่องข้อความที่สุ่มได้
        ========================= */

        .random-result {

            min-height: 80px;

            margin: 30px 0;

            padding: 25px;

            background: #ecfdf5;

            border: 2px solid #86efac;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            font-weight: bold;

            color: #166534;
        }


        /* =========================
           ปุ่ม
        ========================= */

        button {

            background: #16a34a;

            color: white;

            border: none;

            padding: 12px 25px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;
        }


        button:hover {

            background: #15803d;

            transform: scale(1.05);
        }


        /* ปุ่มกลับหน้าหลัก */

        .home-button {

            background: #64748b;

            margin-top: 35px;
        }


        .home-button:hover {

            background: #475569;
        }


        /* =========================
           เว้นระยะระหว่างปุ่ม
        ========================= */

        .random-button {

            margin-top: 10px;

            margin-bottom: 10px;
        }


    </style>

</head>


<body>


<div class="box">


    <h1>
        🐱🙋‍♀️♈️ คลังแสงของขลัง ☀️☀️💎
    </h1>


    <p class="description">

        ยินดีต้อนรับสู่หน้าการแบ่งปันความรู้
        เรื่องของขลังของดีประจำตำบล
        อำเภอ จังหวัด ประเทศ
        ต่างประเทศ ต่างดาว ต่างโลก 555
        🪐🐱

    </p>


    <!-- =========================
         กล่องแสดงข้อความ Random
    ========================= -->

    <div
        id="randomResult"
        class="random-result">

        🔮 กดปุ่มเพื่อสุ่มของขลัง 🔮

    </div>


    <!-- =========================
         ปุ่ม Random
    ========================= -->

    <button
        class="random-button"
        onclick="randomMagic()">

        🔮 สุ่มของขลัง

    </button>


    <!-- =========================
         ปุ่มกลับหน้าหลัก
    ========================= -->

    <br>


    <button
        class="home-button"
        onclick="goHome()">

        ← กลับหน้าหลัก

    </button>


</div>


<script>


    // ====================================
    // รายการข้อความสำหรับสุ่ม
    // ====================================

    const magicItems = [

        "🪄 ไม้เรียวกายสิทธิ์แห่งความโชคดี",

        "💎 ยันต์กันแก้งาน",

        "🐱 แมวกวักเรียกทรัพย์",

        "🧿 ดวงตาคาปิปาร้าป้องกันสิ่งชั่วร้าย",

        "☀️ ตะกรุดหางช้างจากเกาะสีชัง",

        "🔮 ลูกแก้วพยากรณ์แห่งอนาคต",

        "🪙 เหรียญ 10 นำโชคจากเครื่องซักผ้า",

        "🌙 เขี้ยวกบจากดาววันอังคาร",

        "🪽 ขนอัลปาก้าจากท่าน้ำนนท์",

        "🐉 ผ้าถุงแม่แก้คุณไสย์มนต์ดำ",

        "⭐ ดาวนำหางฮังเล่ย์ เพลงจากวง Felow Felow",

        "🪐 เครื่องรางลึกลับจากผับดวงจันทร์",

        "👑 ไม้กวาดเวทมนต์ของที่มีทุกบ้าน",

        "🌈 อเมกาโน่ฟื้นพลังชีวิต",

        "🔥 หินลึกลับจากจันทบุเรี่ยน",

        "🌿 สมุนไพรสีเขียบันดาลความสุข",

        "🍀 ใบโคลเวอร์สี่แฉก",

        "⚡ ศิลานีฮีลใจใกล้ตัวคุณ",

        "🧙‍♂️ เสื้อกันฝนป้องกัยโรคภัย",

        "🧙‍♀️ แมวธนู กู้ภัย ป้องกันอันตราย"

    ];


    // ====================================
    // ฟังก์ชันสุ่มข้อความ
    // ====================================

    function randomMagic() {

        const randomIndex =
            Math.floor(
                Math.random() * magicItems.length
            );


        const randomText =
            magicItems[randomIndex];


        document.getElementById(
            "randomResult"
        ).textContent = randomText;

    }


    // ====================================
    // กลับหน้าหลัก
    // ====================================

    function goHome() {

        window.location.href =
            "index.html";

    }


</script>


</body>

</html>
