<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>สำนักกระทรวงเวทมนต์ศาสตร์</title>


    <style>

    /* =====================================
       RESET
    ===================================== */

    * {
        box-sizing: border-box;
    }


    html,
    body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
    }


    /* =====================================
       🌿🌸 พื้นหลังเขียวชมพู
    ===================================== */

    body {

        min-height: 100vh;

        font-family: Arial, sans-serif;

        text-align: center;

        background:
            linear-gradient(
                120deg,

                #8fd3a8 0%,
                #b8e8c8 20%,
                #d8f0d2 35%,
                #f6d1d9 55%,
                #efa8bc 75%,
                #b7dfc1 100%
            );

        background-size: 400% 400%;

        animation:
            greenPink 25s ease-in-out infinite;

    }


    /* =====================================
       🌈 Animation พื้นหลัง
    ===================================== */

    @keyframes greenPink {

        0% {
            background-position: 0% 50%;
        }

        50% {
            background-position: 100% 50%;
        }

        100% {
            background-position: 0% 50%;
        }

    }


    /* =====================================
       Container
    ===================================== */

    .container {

        width: 100%;

        min-height: 100vh;

        padding: 50px 30px;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

    }


    /* =====================================
       หัวข้อ
    ===================================== */

    h1 {

        margin: 0 0 15px 0;

        color: #374151;

        font-size: clamp(
            30px,
            4vw,
            50px
        );

        text-shadow:
            0 2px 5px
            rgba(255,255,255,0.8);

    }


    .subtitle {

        margin: 0 0 45px 0;

        color: #4b5563;

        font-size: 18px;

    }


    /* =====================================
       กล่องเมนู
    ===================================== */

    .cards {

        width: 100%;

        max-width: 1200px;

        display: flex;

        gap: 30px;

        justify-content: center;

        align-items: stretch;

        flex-wrap: wrap;

    }


    /* =====================================
       Card
    ===================================== */

    .card {

        width: 300px;

        min-height: 250px;

        padding: 35px 30px;

        background:
            rgba(255,255,255,0.93);

        border-radius: 25px;

        box-shadow:
            0 10px 30px
            rgba(0,0,0,0.12);

        display: flex;

        flex-direction: column;

        justify-content: space-between;

        transition:
            transform 0.3s ease,
            box-shadow 0.3s ease;

    }


    .card:hover {

        transform:
            translateY(-10px);

        box-shadow:
            0 18px 35px
            rgba(0,0,0,0.18);

    }


    .card h2 {

        margin-top: 0;

        margin-bottom: 15px;

        color: #374151;

        font-size: 25px;

    }


    .card p {

        color: #64748b;

        line-height: 1.7;

        margin-bottom: 25px;

    }


    /* =====================================
       ปุ่ม
    ===================================== */

    button {

        border: none;

        padding: 13px 25px;

        border-radius: 12px;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;

    }


    button:hover {

        transform:
            scale(1.05);

        opacity: 0.9;

    }


    /* คำทำนาย */

    .knowledge {

        background: #7eb5e8;

    }


    /* Share */

    .share {

        background: #70c493;

    }


    /* เลขเด็ด */

    .random {

        background: #e9b94d;

    }


    /* =====================================
       📱 Responsive
    ===================================== */

    @media (max-width: 768px) {

        .container {

            padding:
                40px 20px;

        }


        .cards {

            flex-direction: column;

            align-items: center;

        }


        .card {

            width: 100%;

            max-width: 400px;

        }

    }

</style>

</head>


<body>


<div class="container">


    <h1>
        🔮 กระทรวงเวทมนต์ศาสตร์
    </h1>


    <p class="subtitle">

        สำนักรวมพลังเวทมนต์
        ของขลัง และคำทำนาย

    </p>


    <div class="cards">


        <!-- ========================= -->
        <!-- คำทำนาย -->
        <!-- ========================= -->

        <div class="card">

            <div>

                <h2>
                    🔮 คำทำนาย
                </h2>

                <p>
                    ดวงวันนี้
                    ดีแน่นอลลลลล
                </p>

            </div>


            <button
                class="knowledge"
                onclick="goToKnowledge()">

                📚 น้อมรับคำทำนาย

            </button>

        </div>


        <!-- ========================= -->
        <!-- Share -->
        <!-- ========================= -->

        <div class="card">

            <div>

                <h2>
                    🤝 Share
                </h2>

                <p>

                    คนดวงดีแห่งปี 2026

                    <br>

                    มาแบ่งปันเรื่องราว
                    และประสบการณ์

                </p>

            </div>


            <button
                class="share"
                onclick="goToShare()">

                🤝 ไปหน้า Share

            </button>

        </div>


        <!-- ========================= -->
        <!-- เลขเด็ด -->
        <!-- ========================= -->

        <div class="card">

            <div>

                <h2>
                    🎲 เลขเด็ด
                </h2>

                <p>

                    สุ่มตัวเลขตั้งแต่
                    1 ถึง 100 🙏

                    <br>

                    สำหรับเลขที่คิดว่า
                    อาจจะออกงวดนี้ 🔮

                </p>

            </div>


            <button
                class="random"
                onclick="goToRandom()">

                🎲 ไปหน้าเลขเด็ด

            </button>

        </div>


    </div>

</div>


<script>


    // =====================================
    // คำทำนาย
    // =====================================

    function goToKnowledge() {

        window.location.href =
            "knowledge.html";

    }


    // =====================================
    // Share
    // =====================================

    function goToShare() {

        window.location.href =
            "share.html";

    }


    // =====================================
    // เลขเด็ด
    // =====================================

    function goToRandom() {

        window.location.href =
            "random.html";

    }


</script>


</body>

</html>
